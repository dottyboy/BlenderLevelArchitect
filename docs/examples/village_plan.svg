<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="800" height="600" viewBox="0 0 800 600">
  <!-- A village drawn as a floor plan: 1 unit = 0.12 m when imported with "Metres per unit" = 0.12.
       Labels (ids) say what each shape is; a shape labelled with a biome becomes a terrain region. -->
  <polygon id="desert_dunes" points="560,330 800,300 800,600 520,600" fill="#e8d9a8" />
  <path id="road_main" d="M 0,300 L 300,300 L 500,330 L 800,330" fill="none" stroke="#777" stroke-width="22" />
  <path id="road_north" d="M 300,300 L 300,40" fill="none" stroke="#777" stroke-width="22" />
  <path id="road_south" d="M 300,300 L 300,600" fill="none" stroke="#777" stroke-width="22" />
  <g id="houses">
    <rect id="house_1" x="170" y="200" width="90" height="62" />
    <rect id="house_2" x="170" y="330" width="80" height="60" />
    <rect id="house_3" x="340" y="200" width="100" height="64" />
    <rect id="house_4" x="350" y="340" width="70" height="86" transform="rotate(8 385 383)" />
    <rect id="chapel" x="340" y="90" width="110" height="70" />
    <rect id="stable_1" x="170" y="440" width="120" height="70" />
  </g>
  <polygon id="farm_yard_wood" points="520,60 760,60 760,240 520,240" />
  <rect id="barn_1" x="545" y="85" width="120" height="70" />
  <rect id="house_5" x="690" y="150" width="55" height="70" />
  <circle id="tree_1" cx="500" cy="270" r="14" />
  <circle id="tree_2" cx="470" cy="250" r="12" />
  <circle id="tree_3" cx="110" cy="260" r="14" />
  <circle id="tower_1" cx="110" cy="120" r="30" />
</svg>
